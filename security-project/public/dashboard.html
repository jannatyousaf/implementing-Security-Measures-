<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #f4f6f9;
    }

    .navbar {
      background: #4facfe;
      color: white;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar h2 {
      margin: 0;
    }

    .logout-btn {
      background: red;
      border: none;
      padding: 8px 15px;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    .container {
      padding: 30px;
    }

    .welcome {
      font-size: 22px;
      margin-bottom: 20px;
    }

    .cards {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      flex: 1;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    .card h3 {
      margin: 10px 0;
      color: #333;
    }

    .activity {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .popup {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 20px;
      color: white;
      border-radius: 5px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<!-- Navbar -->
<div class="navbar">
  <h2>🔐 Secure App</h2>
  <div>
    <span id="userEmail"></span>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </div>
</div>

<div class="container">

  <!-- Welcome -->
  <div class="welcome" id="welcomeText">
    Welcome 👋
  </div>

  <!-- Cards -->
  <div class="cards">
    <div class="card">
      <h3>Total Users</h3>
      <p id="totalUsers">10</p>
    </div>

    <div class="card">
      <h3>Status</h3>
      <p style="color: green;">Active</p>
    </div>

    <div class="card">
      <h3>Security</h3>
      <p style="color: blue;">Protected</p>
    </div>
  </div>

  <!-- Dashboard Content -->
  <div class="activity">
    <h3>Recent Activity</h3>
    <ul id="activityList">
      <li>✔ User logged in</li>
      <li>✔ Token generated</li>
      <li>✔ Accessed dashboard</li>
    </ul>

    <p id="data"></p>
  </div>

</div>

<script src="js/dashboard.js"></script>

</body>
</html>
