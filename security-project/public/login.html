<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
      body {
        font-family: Arial;
        background: linear-gradient(to right, #4facfe, #00f2fe);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .container {
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        text-align: center;
        width: 300px;
      }

      input {
        width: 90%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      button {
        padding: 10px 20px;
        background: #4facfe;
        border: none;
        color: white;
        border-radius: 5px;
        cursor: pointer;
      }

      button:hover {
        background: #007bff;
      }

      .popup {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 12px 20px;
        color: white;
        border-radius: 5px;
        font-weight: bold;
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Login</h2>

      <input id="email" placeholder="Email" />
      <input id="password" placeholder="Password" />

      <button id="loginBtn">Login</button>

      <p>Don't have an account?</p>
      <button id="registerBtn">Register</button>

      
    </div>
<script src="js/login.js"></script>


  </body>
</html>
